# Render Blueprint Specification for Kailash Global Impex
# https://render.com/docs/blueprint-spec

databases:
  - name: kailash-global-db
    databaseName: kailash_db
    user: kailash_user
    plan: starter

services:
  - type: web
    name: kailash-global-impex
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn kailash_project.wsgi:application"
    plan: starter
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "kailashglobalimpex.com,www.kailashglobalimpex.com,kailashglobalimpex.onrender.com,vedop.fun,www.vedop.fun"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://kailashglobalimpex.com,https://www.kailashglobalimpex.com,https://kailashglobalimpex.onrender.com,https://vedop.fun,https://www.vedop.fun"
      - key: DATABASE_URL
        fromDatabase:
          name: kailash-global-db
          property: connectionString
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.hostinger.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: COMPANY_NOTIFICATION_EMAIL
        value: info@kailashglobalimpex.com
